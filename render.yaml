# render.yaml
services:
  - type: web
    name: ai-content-generator-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: pip install --break-system-packages -r requirements.txt && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT --log-level debug
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: PYO3_USE_ABI3_FORWARD_COMPATIBILITY
        value: "1"
      - key: PIP_BREAK_SYSTEM_PACKAGES
        value: "1"
